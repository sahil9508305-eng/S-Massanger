<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatPulse - Messaging & Promo Ads</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 1. LOGIN & SIGN UP SCREEN -->
  <div id="authScreen" class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-logo">💬 ChatPulse</div>
      <p class="auth-subtitle">Fast messaging with built-in promotional ads</p>

      <div class="auth-tabs">
        <button id="loginTab" class="tab-btn active" type="button">Log In</button>
        <button id="signupTab" class="tab-btn" type="button">Sign Up</button>
      </div>

      <form id="authForm">
        <div id="signupFields" class="hidden">
          <input type="text" id="nameInput" placeholder="Full Name (e.g. Rohan Mehta)" />
          <input type="text" id="bioInput" placeholder="Status Bio (e.g. Available)" />
        </div>
        <input type="email" id="emailInput" placeholder="Email Address" required />
        <input type="password" id="passwordInput" placeholder="Password" required />
        <p id="authError" class="error-text"></p>
        <button type="submit" id="authSubmitBtn" class="primary-btn">Log In</button>
      </form>

      <div class="divider"><span>OR</span></div>
      <button id="demoLoginBtn" class="secondary-btn" type="button">
        One-Click Demo Account (Rohan Mehta)
      </button>
    </div>
  </div>

  <!-- 2. MAIN WHATSAPP-STYLE APP -->
  <div id="appContainer" class="app-container hidden">
    
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="user-profile">
          <div id="userAvatar" class="avatar">R</div>
          <span id="userNameDisplay" class="user-name">Rohan</span>
        </div>
        <div class="header-actions">
          <button id="openAdModalBtn" class="ad-btn" title="Promotional Ad Manager">📢 Ads</button>
          <button id="themeToggleBtn" class="icon-btn" title="Toggle Dark/Light Mode">🌙</button>
          <button id="logoutBtn" class="icon-btn" title="Logout">🚪</button>
        </div>
      </header>

      <div class="search-box">
        <input type="text" id="searchChatInput" placeholder="Search chats..." />
      </div>

      <!-- SIDEBAR SPONSORED AD SLOT -->
      <div id="sidebarAdSlot"></div>

      <!-- CHAT LIST -->
      <div id="chatList" class="chat-list"></div>
    </aside>

    <!-- RIGHT CHAT AREA -->
    <main class="chat-area">
      <div id="emptyState" class="empty-state">
        <h2>💬 ChatPulse Web</h2>
        <p>Select a chat to start messaging or click <b>📢 Ads</b> to launch a promo campaign.</p>
      </div>

      <div id="activeChatView" class="active-chat hidden">
        <header class="chat-header">
          <div class="chat-header-left">
            <button id="backBtn" class="icon-btn mobile-only">←</button>
            <div id="activeAvatar" class="avatar">P</div>
            <div>
              <h4 id="activeName">Priya Sharma</h4>
              <small id="activeStatus" class="status-text">online</small>
            </div>
          </div>
          <button id="sendPromoBtn" class="promo-send-btn">📢 Send Promo</button>
        </header>

        <!-- TOP CHAT BANNER AD SLOT -->
        <div id="topBannerSlot"></div>

        <!-- MESSAGES -->
        <div id="messagesContainer" class="messages-container"></div>

        <!-- INPUT BAR -->
        <form id="messageForm" class="message-form">
          <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" required />
          <button type="submit" class="send-btn">Send ➤</button>
        </form>
      </div>
    </main>
  </div>

  <!-- 3. PROMOTIONAL AD MANAGER MODAL -->
  <div id="adModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📢 Promotional Ad Manager</h3>
        <button id="closeAdModalBtn" class="icon-btn">✖</button>
      </div>

      <!-- KPI STATS -->
      <div class="ad-stats">
        <div class="stat-box"><span id="statActiveAds">0</span><small>Active Ads</small></div>
        <div class="stat-box"><span id="statImpressions">0</span><small>Impressions</small></div>
        <div class="stat-box"><span id="statClicks">0</span><small>Clicks</small></div>
        <div class="stat-box"><span id="statCtr">0%</span><small>CTR</small></div>
      </div>

      <!-- CREATE NEW AD FORM -->
      <form id="adForm" class="ad-form">
        <input type="text" id="adTitle" placeholder="Ad Headline (e.g. Festive Sale 40% Off)" required />
        <input type="text" id="adDesc" placeholder="Short description..." required />
        <div class="form-row">
          <input type="text" id="adCta" placeholder="Button Text (e.g. Shop Now)" required />
          <select id="adPlacement">
            <option value="sidebar">Sidebar Sponsored Card</option>
            <option value="banner">Top Chat Banner</option>
          </select>
        </div>
        <button type="submit" class="primary-btn">+ Launch Campaign</button>
      </form>

      <!-- EXISTING CAMPAIGNS LIST -->
      <div id="adListContainer" class="ad-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
