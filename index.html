<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Chat App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background: #0b141a;
      color: #e9edef;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Privacy Blur Overlay */
    #privacy-blur {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 20, 26, 0.96);
      backdrop-filter: blur(20px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 1.2rem;
      color: #00a884;
      padding: 20px;
    }

    /* Watermark Layer */
    #watermark {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.06;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-items: center;
      overflow: hidden;
      font-size: 1.1rem;
      font-weight: bold;
      transform: rotate(-25deg);
    }

    .container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 760px;
      background: #111b21;
      display: flex;
      flex-direction: column;
      border: 1px solid #222e35;
      position: relative;
      z-index: 10;
    }

    /* Auth Screen */
    #auth-screen {
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      gap: 14px;
    }

    #auth-screen h2 {
      color: #00a884;
      text-align: center;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #2a3942;
      background: #202c33;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
      -webkit-user-select: text;
      user-select: text;
    }

    input:focus {
      border-color: #00a884;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #00a884;
      color: #0b141a;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:hover {
      background: #02c39a;
    }

    .secondary-btn {
      background: #202c33;
      color: #e9edef;
    }

    .error-msg {
      color: #ff6b6b;
      font-size: 0.85rem;
      text-align: center;
      min-height: 18px;
    }

    /* Chat Screen */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .header {
      background: #202c33;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a3942;
    }

    .header small {
      color: #8696a0;
      display: block;
      font-size: 0.78rem;
    }

    .logout-btn {
      background: #ef4444;
      color: #fff;
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .connect-bar {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      background: #182229;
      border-bottom: 1px solid #2a3942;
    }

    .connect-bar button {
      padding: 10px 16px;
      white-space: nowrap;
    }

    #messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 78%;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.93rem;
      word-wrap: break-word;
      line-height: 1.4;
    }

    .msg.sent {
      align-self: flex-end;
      background: #005c4b;
      border-bottom-right-radius: 2px;
    }

    .msg.received {
      align-self: flex-start;
      background: #202c33;
      border-bottom-left-radius: 2px;
    }

    .msg-time {
      display: block;
      font-size: 0.68rem;
      color: #aebac1;
      text-align: right;
      margin-top: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      background: #202c33;
    }

    .empty-state {
      text-align: center;
      color: #8696a0;
      margin: auto;
      font-size: 0.9rem;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- Screen Blur on Focus Loss / Screenshot Attempt -->
  <div id="privacy-blur">
    <div>
      <h3>Screen Protected</h3>
      <p style="margin-top:8px; color:#8696a0; font-size:0.9rem;">Chat dekhne ke liye is window par wapas click karein.</p>
    </div>
  </div>

  <!-- Watermark -->
  <div id="watermark"></div>

  <div class="container">
    <!-- LOGIN / SIGNUP SCREEN -->
    <div id="auth-screen">
      <h2>Secure Chat</h2>
      <p style="text-align:center; color:#8696a0; font-size:0.85rem;">
        Apni unique User ID banayein (sirf letters, numbers, _)
      </p>
      <input type="text" id="userid-input" placeholder="User ID (e.g. rahul_99)" autocomplete="off" />
      <input type="password" id="password-input" placeholder="Password (min 6 characters)" />
      <button id="login-btn">Login</button>
      <button id="signup-btn" class="secondary-btn">New Account (Signup)</button>
      <div class="error-msg" id="auth-error"></div>
    </div>

    <!-- MAIN CHAT SCREEN -->
    <div id="chat-screen">
      <div class="header">
        <div>
          <strong id="chat-title">Select a User</strong>
          <small id="my-id-label">My ID: -</small>
        </div>
        <button class="logout-btn" id="logout-btn">Logout</button>
      </div>

      <div class="connect-bar">
        <input type="text" id="target-userid" placeholder="Kisse chat karni hai? User ID daalein" />
        <button id="open-chat-btn">Chat</button>
      </div>

      <div id="messages">
        <div class="empty-state">Upar kisi ki User ID daalkar "Chat" par click karein.</div>
      </div>

      <form class="input-area" id="msg-form">
        <input type="text" id="msg-input" placeholder="Message likhein..." autocomplete="off" disabled />
        <button type="submit" id="send-btn" disabled>Send</button>
      </form>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ==========================================
    // YAHAN APNA FIREBASE CONFIG PASTE KAREIN
    // ==========================================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Elements
    const authScreen = document.getElementById("auth-screen");
    const chatScreen = document.getElementById("chat-screen");
    const useridInput = document.getElementById("userid-input");
    const passwordInput = document.getElementById("password-input");
    const authError = document.getElementById("auth-error");
    const myIdLabel = document.getElementById("my-id-label");
    const chatTitle = document.getElementById("chat-title");
    const targetInput = document.getElementById("target-userid");
    const messagesDiv = document.getElementById("messages");
    const msgInput = document.getElementById("msg-input");
    const sendBtn = document.getElementById("send-btn");
    const watermarkDiv = document.getElementById("watermark");
    const privacyBlur = document.getElementById("privacy-blur");

    let currentUserId = null;
    let activeRoomId = null;
    let unsubscribeChat = null;

    // Helper: Clean & validate User ID
    function cleanId(id) {
      return id.trim().toLowerCase();
    }

    function isValidId(id) {
      return /^[a-z0-9_]{3,20}$/.test(id);
    }

    // Add Watermark with User ID
    function setWatermark(userId) {
      watermarkDiv.innerHTML = "";
      for (let i = 0; i < 24; i++) {
        const span = document.createElement("span");
        span.textContent = `@${userId}`;
        span.style.padding = "24px";
        watermarkDiv.appendChild(span);
      }
    }

    // Signup
    document.getElementById("signup-btn").addEventListener("click", async () => {
      authError.textContent = "";
      const uid = cleanId(useridInput.value);
      const pass = passwordInput.value;

      if (!isValidId(uid)) {
        authError.textContent = "User ID 3-20 characters ki honi chahiye (sirf a-z, 0-9, _).";
        return;
      }
      if (pass.length < 6) {
        authError.textContent = "Password kam se kam 6 characters ka hona chahiye.";
        return;
      }

      try {
        await createUserWithEmailAndPassword(auth, `${uid}@chatapp.local`, pass);
        await set(ref(db, `users/${uid}`), { userId: uid, createdAt: Date.now() });
      } catch (err) {
        authError.textContent = err.code === "auth/email-already-in-use"
          ? "Yeh User ID pehle se kisi ne le li hai."
          : err.message;
      }
    });

    // Login
    document.getElementById("login-btn").addEventListener("click", async () => {
      authError.textContent = "";
      const uid = cleanId(useridInput.value);
      const pass = passwordInput.value;

      if (!uid || !pass) {
        authError.textContent = "User ID aur Password dono daalein.";
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, `${uid}@chatapp.local`, pass);
      } catch (err) {
        authError.textContent = "Galat User ID ya Password.";
      }
    });

    // Logout
    document.getElementById("logout-btn").addEventListener("click", () => {
      if (unsubscribeChat) unsubscribeChat();
      signOut(auth);
    });

    // Auth State Listener
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserId = user.email.split("@")[0];
        myIdLabel.textContent = `My ID: @${currentUserId}`;
        setWatermark(currentUserId);
        authScreen.style.display = "none";
        chatScreen.style.display = "flex";
      } else {
        currentUserId = null;
        activeRoomId = null;
        watermarkDiv.innerHTML = "";
        authScreen.style.display = "flex";
        chatScreen.style.display = "none";
      }
    });

    // Open Chat with another User ID
    document.getElementById("open-chat-btn").addEventListener("click", async () => {
      const targetId = cleanId(targetInput.value);
      if (!isValidId(targetId)) {
        alert("Sahi User ID daalein.");
        return;
      }
      if (targetId === currentUserId) {
        alert("Khud ko message nahi bhej sakte.");
        return;
      }

      // Check if target user exists
      const userSnap = await get(ref(db, `users/${targetId}`));
      if (!userSnap.exists()) {
        alert(`User @${targetId} nahi mila. Pehle unhe signup karne ko bolein.`);
        return;
      }

      // Unique room ID for both users
      activeRoomId = [currentUserId, targetId].sort().join("_");
      chatTitle.textContent = `Chat with @${targetId}`;
      msgInput.disabled = false;
      sendBtn.disabled = false;

      if (unsubscribeChat) unsubscribeChat();

      const roomRef = ref(db, `chats/${activeRoomId}`);
      unsubscribeChat = onValue(roomRef, (snapshot) => {
        messagesDiv.innerHTML = "";
        const data = snapshot.val();
        if (!data) {
          messagesDiv.innerHTML = `<div class="empty-state">@${targetId} ke saath baat shuru karein!</div>`;
          return;
        }

        Object.values(data).forEach((m) => {
          const div = document.createElement("div");
          div.className = `msg ${m.sender === currentUserId ? "sent" : "received"}`;

          const textNode = document.createTextNode(m.text);
          div.appendChild(textNode);

          const timeSpan = document.createElement("span");
          timeSpan.className = "msg-time";
          timeSpan.textContent = new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          div.appendChild(timeSpan);

          messagesDiv.appendChild(div);
        });

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    });

    // Send Message
    document.getElementById("msg-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text || !activeRoomId) return;

      msgInput.value = "";
      await push(ref(db, `chats/${activeRoomId}`), {
        sender: currentUserId,
        text: text,
        time: Date.now()
      });
    });

    // ==========================================
    // WEB-LEVEL ANTI-SCREENSHOT DETERRENTS
    // ==========================================
    // 1. Right-click disable
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    // 2. PrintScreen, Ctrl+P, Ctrl+S block
    document.addEventListener("keyup", (e) => {
      if (e.key === "PrintScreen") {
        navigator.clipboard?.writeText("");
        privacyBlur.style.display = "flex";
        setTimeout(() => alert("Screenshot lena allowed nahi hai!"), 50);
      }
    });

    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && ["p", "s", "u"].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    });

    // 3. Window focus lose hone par screen blur karna
    window.addEventListener("blur", () => {
      if (currentUserId) privacyBlur.style.display = "flex";
    });

    window.addEventListener("focus", () => {
      privacyBlur.style.display = "none";
    });

    privacyBlur.addEventListener("click", () => {
      privacyBlur.style.display = "none";
    });
  </script>
</body>
</html>
